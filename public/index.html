<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Suqiée Repostería · Asistente Virtual</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧁</text></svg>">
  </head>
  <body>
    <div class="chat-wrapper">
      <!-- Header -->
      <header class="chat-header">
        <div class="header-left">
          <div class="avatar">🧁</div>
          <div>
            <h1 class="header-title">Suqiée Repostería</h1>
            <span class="header-subtitle">Asistente Virtual · Hermosillo, Sonora</span>
          </div>
        </div>
        <button class="reset-btn" id="resetBtn" title="Nueva conversación">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 .49-4.5"/>
          </svg>
          <span>Nueva</span>
        </button>
      </header>

      <!-- Messages -->
      <main class="chat-messages" id="chatMessages">
        <div class="message bot-message" id="welcomeMsg">
          <div class="message-bubble">
            <p>🎂 ¡Hola! Soy el asistente virtual de <strong>Suqiée Repostería</strong>.</p>
            <p>Puedo ayudarte con información sobre nuestros pasteles, precios, horarios, sucursales y pedidos especiales.</p>
            <p class="secondary-text">¿En qué te puedo ayudar hoy?</p>
          </div>
          <span class="message-time" id="welcomeTime"></span>
        </div>
      </main>

      <!-- Input -->
      <footer class="chat-input-area">
        <div class="input-row">
          <textarea
            id="userInput"
            class="chat-input"
            placeholder="Escribe tu mensaje..."
            rows="1"
            maxlength="1000"
          ></textarea>
          <button class="send-btn" id="sendBtn" aria-label="Enviar mensaje">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
        <p class="input-hint">Powered by AI · Suqiée Repostería © 2024</p>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
